services:
  - type: web
    name: tour-rail-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173
      - key: ALLOWED_ORIGIN_REGEX
        value: ^https://.*\.onrender\.com$

  - type: web
    name: tour-rail-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    previews:
      generation: automatic
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: tour-rail-api
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
